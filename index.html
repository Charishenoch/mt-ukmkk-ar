<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      
      #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 200; }
      #scanning-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; color: white; z-index: 100; pointer-events: none; }
      #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 150; display: flex; justify-content: center; align-items: center; }
      
      #mtvideo { width: 85%; max-width: 400px; border-radius: 12px; border: 4px solid #ff6600; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
      
      .hidden { display: none !important; }
      
      button { padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; background: #ff6600; color: white; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div id="start-overlay">
      <h2>Siap Scan Pin UKMKK?</h2>
      <button id="startButton">Mulai Scan (Nyalakan Suara)</button>
    </div>

    <div id="scanning-overlay" class="hidden">Arahkan kamera ke Pin Mascot GIRI...</div>

    <div id="video-container" class="hidden">
      <video id="mtvideo" src="./assets/mtvideo.mp4" controls preload="auto" playsinline webkit-playsinline></video>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target1" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
    const targetEl = document.querySelector('#target1');
    const video = document.querySelector('#mtvideo');
    const videoContainer = document.querySelector('#video-container');
    const startOverlay = document.querySelector('#start-overlay');
    const scanningOverlay = document.querySelector('#scanning-overlay');
    const startButton = document.querySelector('#startButton');

    let isVideoPlaying = false; 

    // 1. Klik tombol Mulai
    startButton.addEventListener('click', () => {
        startOverlay.style.display = 'none';
        scanningOverlay.style.display = 'flex'; // Munculin tulisan scan
        
        video.play().then(() => {
        video.pause();
        }).catch(e => console.log("Menunggu target discan..."));
    });

    // 2. Pas Pin Kedetect Pertama Kali
    targetEl.addEventListener("targetFound", event => {
        if (!isVideoPlaying) {
        scanningOverlay.style.display = 'none'; // Ilangin tulisan scan
        videoContainer.classList.remove('hidden'); // Munculin pop-up video
        videoContainer.style.display = 'flex'; // Paksa muncul
        video.play();
        isVideoPlaying = true;
        }
    });

    // 3. Pas Kamera Meleng (INI YANG BIKIN VIDEO TAHAN BANTING)
    targetEl.addEventListener("targetLost", event => {
        // KOSONG MELOMPONG! 
        // Gwe ngga naruh perintah pause() atau nyembunyiin video sama sekali di sini.
        console.log("Kamera meleng, masa bodo video gass terus!");
    });

    // 4. Pas Video Tamat (Selesai)
    video.addEventListener("ended", () => {
        videoContainer.style.display = 'none'; // Sembunyiin pop-up video
        scanningOverlay.style.display = 'flex'; // Munculin lagi tulisan scan
        isVideoPlaying = false; // Reset biar bisa ngetrack lagi
    });
    </script>
  </body>
</html>
