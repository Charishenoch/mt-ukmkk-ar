<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        font-family: 'Poppins', sans-serif; 
        color: white;
      }
      
      #start-overlay { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(15, 15, 15, 0.85); 
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        display: flex; flex-direction: column; justify-content: center; align-items: center; 
        z-index: 200; 
      }
      
      /* Ubah jadi flex-direction column biar bisa nampung teks & tombol senter */
      #scanning-overlay { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0, 0, 0, 0.4); 
        display: flex; flex-direction: column; justify-content: center; align-items: center; 
        z-index: 100; 
      }

      .scan-text {
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 24px;
        border-radius: 50px;
        font-size: 14px;
        letter-spacing: 1px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 20px;
        pointer-events: none; /* Biar teks ga bisa diklik */
      }
      
      #video-container { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(10, 10, 10, 0.9); 
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        z-index: 150; display: flex; justify-content: center; align-items: center; 
      }
      
      #mtvideo { 
        width: 85%; max-width: 380px; 
        border-radius: 16px; 
        border: 1px solid rgba(255, 255, 255, 0.15); 
        box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(255, 102, 0, 0.15); 
      }
      
      h2 {
        font-weight: 600;
        font-size: 22px;
        margin-bottom: 15px;
        letter-spacing: 0.5px;
        text-align: center;
      }

      button { 
        padding: 14px 36px; 
        font-size: 16px; 
        font-family: 'Poppins', sans-serif;
        font-weight: 600; 
        cursor: pointer; 
        border-radius: 50px; 
        border: none; 
        background: linear-gradient(135deg, #ff7e29, #ff5e00); 
        color: white; 
        box-shadow: 0 8px 20px rgba(255, 94, 0, 0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      
      button:active {
        transform: scale(0.95);
        box-shadow: 0 4px 10px rgba(255, 94, 0, 0.2);
      }

      /* Tombol Senter Khusus */
      #flashButton {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 10px 24px;
        font-size: 14px;
        box-shadow: none;
      }
      #flashButton.active {
        background: rgba(255, 255, 255, 0.9);
        color: black;
      }
    </style>
  </head>
  <body>
    <div id="start-overlay">
      <h2>Siap Scan Pin UKMKK?</h2>
      <button id="startButton">Mulai Scan</button>
    </div>

    <div id="scanning-overlay" style="display: none;">
      <div class="scan-text">Arahkan kamera ke Pin Mascot GIRI</div>
      <button id="flashButton">💡 Nyalakan Senter</button>
    </div>

    <div id="video-container" style="display: none;">
      <video id="mtvideo" src="./assets/mtvideo.mp4" controls preload="auto" playsinline webkit-playsinline></video>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target1" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      const targetEl = document.querySelector('#target1');
      const video = document.querySelector('#mtvideo');
      const videoContainer = document.querySelector('#video-container');
      const startOverlay = document.querySelector('#start-overlay');
      const scanningOverlay = document.querySelector('#scanning-overlay');
      const startButton = document.querySelector('#startButton');
      const flashButton = document.querySelector('#flashButton');

      let isVideoPlaying = false; 
      let isFlashOn = false;

      // 1. Klik tombol Mulai
      startButton.addEventListener('click', () => {
        startOverlay.style.display = 'none';
        scanningOverlay.style.display = 'flex';
        
        video.play().then(() => {
          video.pause();
        }).catch(e => console.log("Menunggu target discan..."));
      });

      // 2. Logika Senter (Flashlight)
      flashButton.addEventListener('click', async () => {
        try {
          // Cari video track yang lagi dipakai sama MindAR
          const videoElements = document.querySelectorAll('video');
          let activeTrack = null;
          
          for (let v of videoElements) {
            if (v.srcObject && v.srcObject.getVideoTracks) {
              const tracks = v.srcObject.getVideoTracks();
              if (tracks.length > 0) {
                activeTrack = tracks[0];
                break;
              }
            }
          }

          if (!activeTrack) {
            alert("Kamera belum siap, tunggu sebentar!");
            return;
          }

          // Cek apakah HP/Browser support senter
          const capabilities = activeTrack.getCapabilities();
          if (!capabilities.torch) {
            alert("Maaf, browser atau HP lu nggak support fitur senter WebAR 🙏");
            return;
          }

          // Toggle status senter
          isFlashOn = !isFlashOn;
          await activeTrack.applyConstraints({
            advanced: [{ torch: isFlashOn }]
          });

          // Ubah tampilan tombol
          if (isFlashOn) {
            flashButton.classList.add('active');
            flashButton.innerHTML = "💡 Matikan Senter";
          } else {
            flashButton.classList.remove('active');
            flashButton.innerHTML = "💡 Nyalakan Senter";
          }

        } catch (err) {
          console.error("Error senter:", err);
        }
      });

      // 3. Pas Pin Kedetect Pertama Kali
      targetEl.addEventListener("targetFound", event => {
        if (!isVideoPlaying) {
          scanningOverlay.style.display = 'none'; 
          videoContainer.style.display = 'flex'; 
          video.play();
          isVideoPlaying = true;
          
          // Opsional: Otomatis matiin senter pas video main biar hemat baterai
          if (isFlashOn) {
            flashButton.click(); 
          }
        }
      });

      // 4. Pas Kamera Meleng (Video gas terus)
      targetEl.addEventListener("targetLost", event => {
        console.log("Kamera meleng, video gass terus!");
      });

      // 5. Pas Video Tamat (Selesai)
      video.addEventListener("ended", () => {
        videoContainer.style.display = 'none'; 
        scanningOverlay.style.display = 'flex'; 
        isVideoPlaying = false; 
      });
    </script>
  </body>
</html>
